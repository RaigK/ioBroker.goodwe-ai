<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>goodwe-ai Adapter Settings</title>
    <link rel="stylesheet" href="../../css/adapter.css" />
    <script type="text/javascript" src="../../js/jquery.js"></script>
    <script type="text/javascript" src="../../socket.io/socket.io.js"></script>
    <script type="text/javascript" src="../../js/translate.js"></script>
    <script type="text/javascript" src="../../js/adapter-settings.js"></script>
    <style>
        .col { padding: 8px; }
        label { font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; }
        .help { color: #888; font-size: 0.85em; }
        h3 { border-bottom: 1px solid #ddd; padding-bottom: 4px; }
    </style>
</head>
<body>
    <div class="m adapter-container">
        <div class="row">
            <div class="col s12">
                <h3>Connection Settings</h3>
            </div>
            <div class="col s12 m6">
                <label for="host">Inverter IP Address</label>
                <input type="text" id="host" placeholder="192.168.1.1" />
                <p class="help">IP address of your Goodwe inverter on the local network</p>
            </div>
            <div class="col s12 m3">
                <label for="port">Modbus Port</label>
                <input type="number" id="port" placeholder="502" min="1" max="65535" />
            </div>
            <div class="col s12 m3">
                <label for="unitId">Unit ID (Slave ID)</label>
                <input type="number" id="unitId" placeholder="247" min="1" max="255" />
                <p class="help">Goodwe ET default: 247</p>
            </div>

            <div class="col s12">
                <h3>Polling Settings</h3>
            </div>
            <div class="col s12 m6">
                <label for="pollInterval">Poll Interval (seconds)</label>
                <input type="number" id="pollInterval" placeholder="30" min="10" max="300" />
            </div>
            <div class="col s12 m6">
                <label for="timeout">Connection Timeout (seconds)</label>
                <input type="number" id="timeout" placeholder="10" min="3" max="60" />
            </div>
        </div>
    </div>

    <script>
        function load(settings, onChange) {
            if (!settings) return;
            $('.value').each(function () {
                var $this = $(this);
                if ($this.attr('type') === 'checkbox') {
                    $this.prop('checked', settings[$this.attr('id')] || false);
                } else {
                    $this.val(settings[$this.attr('id')] !== undefined ? settings[$this.attr('id')] : $this.attr('placeholder'));
                }
                $this.on('change', onChange);
            });
        }

        function save(callback) {
            var obj = {};
            $('.value').each(function () {
                var $this = $(this);
                if ($this.attr('type') === 'checkbox') {
                    obj[$this.attr('id')] = $this.prop('checked');
                } else if ($this.attr('type') === 'number') {
                    obj[$this.attr('id')] = parseInt($this.val(), 10);
                } else {
                    obj[$this.attr('id')] = $this.val();
                }
            });
            callback(obj);
        }

        // Add 'value' class to all inputs
        $('input').addClass('value');
    </script>
</body>
</html>
